[project]
name = "hiyo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bleak>=3.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "pydantic>=2",
    "python-dotenv>=1.2.4",
    "recurring-ical-events>=3.8.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
